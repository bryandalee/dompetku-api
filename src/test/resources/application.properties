spring.application.name=dompetku-test

# Database khusus test: H2 di memori, dibuat ulang setiap test dijalankan
spring.datasource.url=jdbc:h2:mem:dompetku-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT khusus test
dompetku.jwt.secret=secret-khusus-test-minimal-32-karakter-ya
dompetku.jwt.expiration-hours=1
