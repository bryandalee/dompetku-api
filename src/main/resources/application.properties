spring.application.name=dompetku
server.port=${PORT:8080}

# Nilai rahasia lokal dibaca dari file .env (tidak ikut ke Git); di server diisi lewat environment variable
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dompetku}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# JWT
dompetku.jwt.secret=${JWT_SECRET}
dompetku.jwt.expiration-hours=24

# CORS (alamat frontend yang boleh memanggil API)
dompetku.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
